[project]
name = "security-triage-ai"
version = "0.1.0"
description = "Agentic AI system for autonomous security alert triage"
requires-python = ">=3.11"
authors = [{name = "Devin Garrett"}]
readme = "README.md"
license = {text = "MIT"}

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
